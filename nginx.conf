server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # SPA routing: any path that isn't a real static file falls back to
    # index.html, so client-side routes (e.g. /schedule) survive a hard
    # refresh or a deep link instead of 404ing at the file-serving layer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (filenames change on every release) can be cached
    # aggressively; index.html itself is deliberately left out of this block
    # so a new deploy is picked up on next load instead of being cached stale.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
